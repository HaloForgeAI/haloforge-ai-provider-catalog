name: Sync upstream model catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-models
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync upstream sources
        run: npm run sync:upstreams
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Build aggregate catalog
        run: npm run build

      - name: Verify generated catalog
        run: |
          npm run check
          npm test

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify sync change risk
        if: steps.changes.outputs.changed == 'true'
        id: risk
        run: node scripts/classify-sync-change.mjs

      - name: Commit and open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          SYNC_PR_TOKEN: ${{ secrets.HF_PROVIDER_CATALOG_SYNC_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
          BRANCH_NAME: chore/sync-upstream-model-catalog
          SAFE_TO_AUTO_MERGE: ${{ steps.risk.outputs.safe }}
          SYNC_RISK_SUMMARY: ${{ steps.risk.outputs.summary }}
        shell: bash
        run: |
          if [ -n "${SYNC_PR_TOKEN:-}" ]; then
            export GH_TOKEN="$SYNC_PR_TOKEN"
          else
            export GH_TOKEN="$GITHUB_TOKEN_FALLBACK"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add catalog/manifest.json catalog/model-provider-catalog.json providers sources package.json scripts .github/workflows
          git commit -m "Sync upstream model catalog"
          git push --force-with-lease origin "$BRANCH_NAME"
          pr_number="$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')"
          pr_body="Automated sync from configured machine-readable upstream sources and curated official-doc overrides.

          Risk classification: ${SYNC_RISK_SUMMARY}

          Safe additions and upstream-owned metadata refreshes are eligible for auto-merge. Provider metadata, Agent gateway, lifecycle, removal, restricted/preview, and fallback changes require human review."
          if [ -n "$pr_number" ]; then
            echo "A sync pull request already exists for $BRANCH_NAME."
            gh pr edit "$pr_number" --body "$pr_body"
          elif gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Sync upstream model catalog" \
            --body "$pr_body"; then
            echo "Created sync pull request for $BRANCH_NAME."
            pr_number="$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')"
          else
            echo "::warning::Unable to create a pull request from GitHub Actions. The sync branch was pushed successfully."
            echo "::notice::Open the review PR manually: https://github.com/$GITHUB_REPOSITORY/pull/new/$BRANCH_NAME"
          fi

          if [ "$SAFE_TO_AUTO_MERGE" = "true" ] && [ -n "$pr_number" ]; then
            if gh pr merge "$pr_number" --auto --squash; then
              echo "Enabled auto-merge for safe sync pull request #$pr_number."
            elif gh pr merge "$pr_number" --squash; then
              echo "Merged verified safe sync pull request #$pr_number immediately because protected-branch auto-merge is unavailable."
            else
              echo "::warning::Safe sync PR #$pr_number could not be merged. Check token permissions and repository merge policy."
            fi
          else
            echo "Sync PR requires human review: ${SYNC_RISK_SUMMARY}"
          fi
